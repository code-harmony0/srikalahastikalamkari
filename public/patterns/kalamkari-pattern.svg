<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="kalamkari-motif" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Central lotus flower -->
      <g transform="translate(60,60)">
        <!-- Petals -->
        <ellipse cx="0" cy="-25" rx="12" ry="20" fill="currentColor" opacity="0.3"/>
        <ellipse cx="21.65" cy="-12.5" rx="12" ry="20" fill="currentColor" opacity="0.3" transform="rotate(60)"/>
        <ellipse cx="21.65" cy="12.5" rx="12" ry="20" fill="currentColor" opacity="0.3" transform="rotate(120)"/>
        <ellipse cx="0" cy="25" rx="12" ry="20" fill="currentColor" opacity="0.3" transform="rotate(180)"/>
        <ellipse cx="-21.65" cy="12.5" rx="12" ry="20" fill="currentColor" opacity="0.3" transform="rotate(240)"/>
        <ellipse cx="-21.65" cy="-12.5" rx="12" ry="20" fill="currentColor" opacity="0.3" transform="rotate(300)"/>
        <!-- Center -->
        <circle cx="0" cy="0" r="8" fill="currentColor" opacity="0.4"/>
        <circle cx="0" cy="0" r="4" fill="currentColor" opacity="0.5"/>
      </g>
      
      <!-- Corner decorative elements -->
      <g transform="translate(15,15)">
        <path d="M0,0 Q10,-5 20,0 Q10,5 0,0" fill="currentColor" opacity="0.2"/>
        <circle cx="10" cy="0" r="3" fill="currentColor" opacity="0.25"/>
      </g>
      <g transform="translate(105,15)">
        <path d="M0,0 Q-10,-5 -20,0 Q-10,5 0,0" fill="currentColor" opacity="0.2"/>
        <circle cx="-10" cy="0" r="3" fill="currentColor" opacity="0.25"/>
      </g>
      <g transform="translate(15,105)">
        <path d="M0,0 Q10,5 20,0 Q10,-5 0,0" fill="currentColor" opacity="0.2"/>
        <circle cx="10" cy="0" r="3" fill="currentColor" opacity="0.25"/>
      </g>
      <g transform="translate(105,105)">
        <path d="M0,0 Q-10,5 -20,0 Q-10,-5 0,0" fill="currentColor" opacity="0.2"/>
        <circle cx="-10" cy="0" r="3" fill="currentColor" opacity="0.25"/>
      </g>
      
      <!-- Connecting vine elements -->
      <path d="M30,60 Q45,45 60,60 Q75,75 90,60" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.15"/>
      <path d="M60,30 Q75,45 60,60 Q45,75 60,90" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.15"/>
      
      <!-- Small decorative dots -->
      <circle cx="30" cy="30" r="2" fill="currentColor" opacity="0.2"/>
      <circle cx="90" cy="30" r="2" fill="currentColor" opacity="0.2"/>
      <circle cx="30" cy="90" r="2" fill="currentColor" opacity="0.2"/>
      <circle cx="90" cy="90" r="2" fill="currentColor" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#kalamkari-motif)"/>
</svg>
