name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # NEXT_PUBLIC_* vars are baked into the client bundle at build time.
      # Passing them here ensures the CI build matches what production will serve.
      # If these secrets are not set, the build still runs but CF images will
      # fall back to placeholder — matching the missing-env production failure.
      - name: Build
        env:
          NEXT_PUBLIC_CF_IMAGES_HASH: ${{ secrets.NEXT_PUBLIC_CF_IMAGES_HASH }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm run build
