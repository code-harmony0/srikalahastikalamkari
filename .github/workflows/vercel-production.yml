name: Vercel Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skip when Vercel secrets are not configured
        if: env.VERCEL_TOKEN == "" || env.VERCEL_ORG_ID == "" || env.VERCEL_PROJECT_ID == ""
        run: |
          echo "Vercel deploy skipped. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID repository secrets to enable production deploys."

      - name: Pull Vercel environment
        if: env.VERCEL_TOKEN != "" && env.VERCEL_ORG_ID != "" && env.VERCEL_PROJECT_ID != ""
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        if: env.VERCEL_TOKEN != "" && env.VERCEL_ORG_ID != "" && env.VERCEL_PROJECT_ID != ""
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        if: env.VERCEL_TOKEN != "" && env.VERCEL_ORG_ID != "" && env.VERCEL_PROJECT_ID != ""
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
