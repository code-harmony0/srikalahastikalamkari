name: Diagnose Hostinger

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.HOSTINGER_PORT }}"
          PORT="${PORT:-65002}"
          ssh-keyscan -p "$PORT" -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts
          echo "DEPLOY_PORT=$PORT" >> $GITHUB_ENV

      - name: Deep server state check
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p $DEPLOY_PORT \
            -o StrictHostKeyChecking=no \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            "
          DOMAIN=~/domains/srikalahastikalamkari.in
          NODE=\$DOMAIN/nodejs
          PUB=\$DOMAIN/public_html

          echo '=== public_html BUILD_ID (is this the old build?) ==='
          cat \$PUB/.next/BUILD_ID 2>/dev/null || echo '(not found)'

          echo ''
          echo '=== console.log in public_html? ==='
          ls -la \$PUB/console.log 2>/dev/null || echo '(no console.log in public_html)'
          ls -la \$PUB/stderr.log 2>/dev/null || echo '(no stderr.log in public_html)'
          ls -la \$PUB/tmp/ 2>/dev/null | head -10 || echo '(no tmp/ in public_html)'

          echo ''
          echo '=== Start app, wait 15s, check ALL sockets and ports ==='
          export PATH=/opt/alt/alt-nodejs22/root/usr/bin:\$PATH
          cd \$NODE
          NODE_ENV=production node server.js &
          APP_PID=\$!
          echo \"PID: \$APP_PID\"
          sleep 15
          echo '--- All listening sockets ---'
          ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null
          echo ''
          echo '--- Process still alive? ---'
          ps -p \$APP_PID 2>/dev/null && echo 'YES' || echo 'Process died!'
          echo '--- New console.log tail ---'
          tail -5 \$NODE/console.log 2>/dev/null
          echo '--- New stderr tail ---'
          tail -5 \$NODE/stderr.log 2>/dev/null
          kill \$APP_PID 2>/dev/null
          wait \$APP_PID 2>/dev/null

          echo ''
          echo '=== Touch restart.txt in BOTH directories and note times ==='
          mkdir -p \$PUB/tmp && touch \$PUB/tmp/restart.txt
          echo \"public_html/tmp/restart.txt touched at: \$(stat -c %y \$PUB/tmp/restart.txt 2>/dev/null)\"
          touch \$NODE/tmp/restart.txt
          echo \"nodejs/tmp/restart.txt touched at: \$(stat -c %y \$NODE/tmp/restart.txt 2>/dev/null)\"
          echo 'Both restart.txt files touched. Check site in 30-60s after this workflow finishes.'

          echo ''
          echo '=== public_html/server.js content ==='
          cat \$PUB/server.js 2>/dev/null || echo '(not found)'
          "

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
