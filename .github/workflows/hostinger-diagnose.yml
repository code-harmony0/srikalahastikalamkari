name: Diagnose Hostinger

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.HOSTINGER_PORT }}"
          PORT="${PORT:-65002}"
          ssh-keyscan -p "$PORT" -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts
          echo "DEPLOY_PORT=$PORT" >> $GITHUB_ENV

      - name: Check state and stderr, set up cron
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p $DEPLOY_PORT \
            -o StrictHostKeyChecking=no \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" << 'ENDSSH'
          export PATH=/opt/alt/alt-nodejs22/root/usr/bin:$PATH
          APP=/home/u445841538/domains/srikalahastikalamkari.in/nodejs

          echo "=== Server load ==="
          uptime

          echo ""
          echo "=== Node processes ==="
          ps aux | grep -E "node|next" | grep -v grep || echo "(none)"

          echo ""
          echo "=== Port 3000 ==="
          ss -tlnp 2>/dev/null | grep 3000 || echo "(not listening)"

          echo ""
          echo "=== stderr.log last 30 lines ==="
          tail -30 "$APP/stderr.log" 2>/dev/null || echo "(empty)"

          echo ""
          echo "=== console.log last 20 lines ==="
          tail -20 "$APP/console.log" 2>/dev/null || echo "(empty)"

          echo ""
          echo "=== Current crontab ==="
          crontab -l 2>/dev/null || echo "(none)"

          echo ""
          echo "=== Setting up cron to auto-restart app ==="
          CRON_CMD="PATH=/opt/alt/alt-nodejs22/root/usr/bin:\$PATH; APP=$APP; if ! pgrep -f 'node.*server.js' > /dev/null 2>&1; then cd \"\$APP\" && NODE_ENV=production nohup node server.js >> \"\$APP/console.log\" 2>> \"\$APP/stderr.log\" & fi"
          CRON_LINE="* * * * * $CRON_CMD"
          # Remove old entry, add new one
          ( crontab -l 2>/dev/null | grep -v "server.js" ; echo "$CRON_LINE" ) | crontab -
          echo "Cron job installed:"
          crontab -l 2>/dev/null | grep server.js

          echo ""
          echo "=== Starting app now (if not running) ==="
          if ! pgrep -f "node.*server.js" > /dev/null 2>&1; then
            cd "$APP"
            NODE_ENV=production nohup node server.js >> "$APP/console.log" 2>> "$APP/stderr.log" &
            echo "Started PID $!"
          else
            echo "Already running"
          fi
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
