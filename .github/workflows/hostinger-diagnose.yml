name: Diagnose Hostinger

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.HOSTINGER_PORT }}"
          PORT="${PORT:-65002}"
          ssh-keyscan -p "$PORT" -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts
          echo "DEPLOY_PORT=$PORT" >> $GITHUB_ENV

      - name: Read app logs and check restart mechanism
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p $DEPLOY_PORT \
            -o StrictHostKeyChecking=no \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            "
          APP=~/domains/srikalahastikalamkari.in/nodejs

          echo '=== Last 80 lines of console.log ==='
          tail -80 \$APP/console.log 2>/dev/null || echo '(empty or not found)'

          echo ''
          echo '=== stderr.log ==='
          cat \$APP/stderr.log 2>/dev/null || echo '(empty)'

          echo ''
          echo '=== tmp/ contents and restart.txt mtime ==='
          ls -la \$APP/tmp/ 2>/dev/null || echo '(tmp/ not found)'

          echo ''
          echo '=== public_html server.js check ==='
          ls -la ~/domains/srikalahastikalamkari.in/public_html/server.js 2>/dev/null || echo '(no server.js in public_html)'

          echo ''
          echo '=== Check Passenger/LiteSpeed .htaccess in domain root ==='
          cat ~/domains/srikalahastikalamkari.in/.htaccess 2>/dev/null || echo '(no .htaccess at domain root)'

          echo ''
          echo '=== Check for passenger_wsgi.py or similar ==='
          find ~/domains/srikalahastikalamkari.in/ -maxdepth 3 -name '*.htaccess' 2>/dev/null

          echo ''
          echo '=== Disk usage of nodejs/ ==='
          du -sh \$APP/ 2>/dev/null

          echo ''
          echo '=== Start app in background, wait 5s, check port, then kill ==='
          export PATH=/opt/alt/alt-nodejs22/root/usr/bin:\$PATH
          cd \$APP
          NODE_ENV=production node server.js >> \$APP/console.log 2>> \$APP/stderr.log &
          APP_PID=\$!
          echo \"Started with PID: \$APP_PID\"
          sleep 5
          ss -tlnp 2>/dev/null | grep 3000 && echo 'PORT 3000 IS LISTENING' || echo 'Port 3000 not listening after 5s'
          ps -p \$APP_PID 2>/dev/null && echo 'Process still running' || echo 'Process already died'
          echo ''
          echo '=== stderr after start attempt ==='
          tail -10 \$APP/stderr.log 2>/dev/null || echo '(empty)'
          kill \$APP_PID 2>/dev/null
          echo 'Killed test process'
          "

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
