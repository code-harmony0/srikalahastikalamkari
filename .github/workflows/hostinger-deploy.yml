name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one deploy runs at a time; queued runs cancel the older one.
concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # ── Required GitHub repository secrets ───────────────────────────────────
    # HOSTINGER_HOST        — your server IP or hostname (e.g. 123.45.67.89)
    # HOSTINGER_USER        — SSH username (e.g. root or your account username)
    # HOSTINGER_SSH_KEY     — contents of your SSH private key (~/.ssh/id_rsa)
    # HOSTINGER_PATH        — absolute deployment path (e.g. /home/user/app)
    #
    # ── Required app env var secrets ─────────────────────────────────────────
    # NEXT_PUBLIC_CF_IMAGES_HASH      — Cloudflare Images delivery hash
    # NEXT_PUBLIC_SUPABASE_URL        — Supabase project URL
    # NEXT_PUBLIC_SUPABASE_ANON_KEY   — Supabase anon/public key
    # NEXT_PUBLIC_SITE_URL            — Production site URL
    # SUPABASE_SERVICE_ROLE_KEY       — Supabase service role key (server only)
    # CF_ACCOUNT_ID                   — Cloudflare account ID
    # CF_IMAGES_TOKEN                 — Cloudflare Images API token
    # ADMIN_EMAIL                     — Admin login email
    # ADMIN_PASSWORD                  — Admin login password
    # ─────────────────────────────────────────────────────────────────────────

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # NEXT_PUBLIC_* vars are baked into the client bundle at build time.
      # They MUST be present here, not only on the server.
      - name: Build
        env:
          NEXT_PUBLIC_CF_IMAGES_HASH: ${{ secrets.NEXT_PUBLIC_CF_IMAGES_HASH }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          # Server-only vars (not baked into bundle, but needed during build for
          # any server-side rendering or API route pre-generation)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_IMAGES_TOKEN: ${{ secrets.CF_IMAGES_TOKEN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npm run build

      # Write the .env.production file so the running server process has all
      # vars at runtime (server-only vars like CF_IMAGES_TOKEN need this).
      - name: Write runtime env file
        run: |
          cat > .env.production << 'EOF'
          NEXT_PUBLIC_CF_IMAGES_HASH=${{ secrets.NEXT_PUBLIC_CF_IMAGES_HASH }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}
          CF_IMAGES_TOKEN=${{ secrets.CF_IMAGES_TOKEN }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          NODE_ENV=production
          EOF

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.HOSTINGER_PORT }}"
          PORT="${PORT:-65002}"
          ssh-keyscan -p "$PORT" -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts
          echo "DEPLOY_PORT=$PORT" >> $GITHUB_ENV

      - name: Deploy files to Hostinger
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.next/cache' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '*.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=no" \
            .next \
            public \
            src \
            server.js \
            package.json \
            package-lock.json \
            next.config.mjs \
            tailwind.config.ts \
            postcss.config.js \
            tsconfig.json \
            .env.production \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PATH }}/"

      - name: Install production dependencies on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p $DEPLOY_PORT \
            -o StrictHostKeyChecking=no \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            "export PATH=/opt/alt/alt-nodejs22/root/usr/bin:\$PATH && cd ${{ secrets.HOSTINGER_PATH }} && npm ci --omit=dev"

      # Restart the Node.js app on the server.
      # Strategy:
      #   1. Touch tmp/restart.txt — Passenger/LiteSpeed picks this up if it's managing the process.
      #   2. Kill any stale node process so nohup starts fresh.
      #   3. Start the app via nohup; LiteSpeed proxies to it on port 3000.
      #   4. Install a per-minute cron job that auto-restarts the app if it ever stops.
      #   5. Wait up to 90 s for port 3000 (cold start on a loaded shared host can take 1-2 min).
      - name: Restart app on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p $DEPLOY_PORT \
            -o StrictHostKeyChecking=no \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" << 'ENDSSH'
          export PATH=/opt/alt/alt-nodejs22/root/usr/bin:$PATH
          APP=${{ secrets.HOSTINGER_PATH }}

          echo "Server load: $(uptime | awk -F'load average:' '{print $2}')"

          # Signal Passenger (if it's still managing the process)
          mkdir -p "$APP/tmp"
          touch "$APP/tmp/restart.txt"
          touch "$APP/tmp/always_restart.txt"

          # Kill any existing node process so we start clean
          pkill -f "node.*server.js" 2>/dev/null || true
          sleep 3

          # Install a cron job that auto-restarts the app every 5 min if it's not running.
          # This survives reboots and handles crashes on shared hosting.
          CRON_LINE="*/5 * * * * PATH=/opt/alt/alt-nodejs22/root/usr/bin:\$PATH; APP=$APP; if ! pgrep -f 'node.*server.js' > /dev/null 2>&1; then cd \"\$APP\" && NODE_ENV=production nohup node server.js >> \"\$APP/console.log\" 2>> \"\$APP/stderr.log\" & fi"
          ( crontab -l 2>/dev/null | grep -v "server.js" ; echo "$CRON_LINE" ) | crontab -
          echo "Cron job installed for auto-restart"

          # Start the app now via nohup
          cd "$APP"
          NODE_ENV=production nohup node server.js >> "$APP/console.log" 2>> "$APP/stderr.log" &
          echo "nohup started PID $!"

          # Wait up to 90 s for port 3000 (shared hosting cold start can be slow)
          for i in $(seq 1 18); do
            sleep 5
            if ss -tlnp 2>/dev/null | grep -q :3000; then
              echo "✓ Port 3000 is listening (attempt $i)"
              break
            fi
            echo "  ... waiting for port 3000 (attempt $i/18, $(( i * 5 ))s elapsed)"
          done

          echo ""
          echo "Final state:"
          ss -tlnp 2>/dev/null | grep :3000 && echo "✓ App is UP on port 3000" || echo "⚠ Port 3000 not yet listening — cron will auto-start within 60 s"
          echo ""
          echo "Last 5 lines of stderr.log:"
          tail -5 "$APP/stderr.log" 2>/dev/null || echo "(empty)"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
